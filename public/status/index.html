<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status - Lattice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/app.css" />
  <script src="/app.js"></script>
  <style>
    .overall {
      display: flex; align-items: center; gap: 0.8rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-card); padding: 1.1rem 1.25rem; margin-bottom: 1.4rem;
    }
    .overall h2 { font-size: 1.25rem; letter-spacing: -0.02em; margin: 0; }
    .overall p { margin: 0.1rem 0 0; color: var(--muted); font-size: 0.85rem; }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .dot.good { background: var(--good); box-shadow: 0 0 10px rgba(52,211,153,0.5); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 10px rgba(251,191,36,0.5); }
    .dot.bad  { background: var(--bad);  box-shadow: 0 0 10px rgba(248,113,113,0.5); }
    .svc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.8rem; margin-bottom: 1.4rem; }
    .svc {
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-card); padding: 1rem 1.1rem;
    }
    .svc-top { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.35rem; }
    .svc-name { font-weight: 600; font-size: 0.95rem; }
    .svc-state { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.8rem; font-weight: 600; }
    .svc-state.good { color: var(--good); }
    .svc-state.warn { color: var(--warn); }
    .svc-state.bad  { color: var(--bad); }
    .svc-note { color: var(--muted); font-size: 0.8rem; margin: 0; }
    .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; margin-bottom: 1.4rem; }
    .stat {
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-card); padding: 0.9rem 1.1rem;
    }
    .stat-v { font-family: var(--mono); font-size: 1.3rem; font-weight: 600; }
    .stat-l { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .meta-line { color: var(--muted); font-size: 0.8rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .refresh-btn {
      background: var(--bg-elev); color: var(--text); border: 1px solid var(--border-hi);
      border-radius: 8px; padding: 0.3rem 0.7rem; font-size: 0.78rem; cursor: pointer;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
    .honest { color: var(--muted); font-size: 0.8rem; margin-top: 1.6rem; border-top: 1px solid var(--border); padding-top: 1.2rem; }
  </style>
</head>
<body>
  <script>document.write(Lat.header());</script>
  <main style="max-width:740px">
    <section style="padding-top:1rem">
      <div class="overall" id="overall">
        <span class="dot warn" id="overall-dot"></span>
        <div>
          <h2 id="overall-title">Checking...</h2>
          <p id="overall-sub">Talking to the live API.</p>
        </div>
      </div>

      <div class="svc-grid" id="svc-grid"></div>

      <h3 style="font-size:0.95rem;margin:0 0 0.7rem">Last 24 hours</h3>
      <div class="stat-row" id="stat-row"></div>

      <div class="meta-line">
        <span id="last-checked">Last checked: never</span>
        <button class="refresh-btn" onclick="refresh()">Refresh</button>
        <span>auto-refreshes every 60s</span>
      </div>

      <p class="honest">This page reads the live API (<span style="font-family:var(--mono)">/api/status</span>) and aggregate request logs. Historical uptime isn't tracked yet - what's shown is current state plus the last 24 hours of request data.</p>
    </section>
  </main>
  <script>document.write(Lat.footer());</script>
  <script>Lat.renderNav();</script>
  <script>
    const MODELS = [
      { id: "quark", name: "Quark 1.5B" },
      { id: "spark", name: "Spark 1.5B" }
    ];
    const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function svcCard(name, cls, state, note) {
      return `<div class="svc">
        <div class="svc-top">
          <span class="svc-name">${esc(name)}</span>
          <span class="svc-state ${cls}"><span class="dot ${cls}"></span>${esc(state)}</span>
        </div>
        <p class="svc-note">${esc(note)}</p>
      </div>`;
    }

    function render(data, fetchError) {
      const grid = document.getElementById("svc-grid");
      const statRow = document.getElementById("stat-row");
      const dot = document.getElementById("overall-dot");
      const title = document.getElementById("overall-title");
      const sub = document.getElementById("overall-sub");
      const cards = [];

      let overall = "good", overallTitle = "All systems operational", overallSub = "Site, API and both models are up.";

      if (fetchError || !data) {
        cards.push(svcCard("Site & API", "bad", "Down", "The status API did not respond. The site may be unreachable."));
        for (const m of MODELS) cards.push(svcCard(m.name, "bad", "Unknown", "Can't check - the status API did not respond."));
        overall = "bad"; overallTitle = "Major outage"; overallSub = "The API is not responding.";
        statRow.innerHTML = "";
      } else {
        const loaded = (data.backend && data.backend.loaded) || [];
        const backendUp = !!data.ok;
        const usage = data.usage_24h;

        cards.push(svcCard("Site & API", "good", "Operational", backendUp ? "Worker and inference backend are responding." : "Site and API are responding."));

        let anyModelDown = false, anyStandby = false;
        for (const m of MODELS) {
          if (!backendUp) {
            cards.push(svcCard(m.name, "warn", "Degraded", "The model server is warming up or offline. First request may fail or be slow."));
            anyModelDown = true;
          } else if (loaded.includes(m.id)) {
            cards.push(svcCard(m.name, "good", "Operational", "Loaded on the GPU and serving."));
          } else {
            cards.push(svcCard(m.name, "warn", "Standby", "Not currently loaded - it reloads on the next request, which can take a minute or two."));
            anyStandby = true;
          }
        }

        if (!backendUp) {
          overall = "warn"; overallTitle = "Models degraded"; overallSub = data.error || "The inference backend is warming up or offline.";
        } else if (anyStandby) {
          overall = "good"; overallTitle = "All systems operational"; overallSub = "Everything is up. Idle models warm up on first use.";
        }

        if (usage) {
          const rate = usage.requests ? (usage.errors / usage.requests * 100) : 0;
          const rateTxt = (rate < 0.05 && usage.errors > 0 ? "<0.1" : rate.toFixed(1)) + "%";
          const lat = usage.avg_latency_ms >= 1000 ? (usage.avg_latency_ms / 1000).toFixed(1) + "s" : usage.avg_latency_ms + "ms";
          statRow.innerHTML =
            `<div class="stat"><div class="stat-v">${usage.requests.toLocaleString()}</div><div class="stat-l">requests</div></div>` +
            `<div class="stat"><div class="stat-v">${usage.errors.toLocaleString()}</div><div class="stat-l">errors</div></div>` +
            `<div class="stat"><div class="stat-v">${rateTxt}</div><div class="stat-l">error rate</div></div>` +
            `<div class="stat"><div class="stat-v">${lat}</div><div class="stat-l">avg latency</div></div>`;
        } else {
          statRow.innerHTML = `<div class="stat"><div class="stat-v">-</div><div class="stat-l">usage data unavailable</div></div>`;
        }
      }

      grid.innerHTML = cards.join("");
      dot.className = "dot " + overall;
      title.textContent = overallTitle;
      sub.textContent = overallSub;
      document.getElementById("last-checked").textContent = "Last checked: " + new Date().toLocaleTimeString();
    }

    async function refresh() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        render(await res.json(), null);
      } catch (e) {
        render(null, e);
      }
    }

    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
